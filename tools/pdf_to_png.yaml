description:
  human:
    en_US: A tool for converting PDF files to PNG images
    zh_Hans: 一个将PDF文件转换为PNG图片的工具
  llm: A tool that converts each page of a PDF document into a separate PNG image with configurable quality
extra:
  python:
    source: tools/pdf_to_png.py
identity:
  author: kalochin
  label:
    en_US: PDF to PNG Converter
    zh_Hans: PDF转PNG转换器
  name: pdf_to_png
parameters:
- form: llm
  human_description:
    en_US: PDF file to convert to PNG images
    zh_Hans: 要转换为PNG图片的PDF文件
  label:
    en_US: PDF Content
    zh_Hans: PDF 内容
  llm_description: PDF file content to be converted to PNG images
  name: pdf_content
  required: true
  type: file
- form: llm
  human_description:
    en_US: Zoom factor for image quality (default is 2)
    zh_Hans: 图像质量的缩放因子（默认为2）
  label:
    en_US: Zoom Factor
    zh_Hans: 缩放因子
  llm_description: Zoom factor to control the quality of output PNG images
  name: zoom
  required: false
  type: number
  default: 2
- form: llm
  human_description:
    en_US: Max size in MB (auto-downgrades if exceeded, optional)
    zh_Hans: 单张图片大小上限（MB），超限自动降级，留空不限制
  label:
    en_US: Max Image Size (MB)
    zh_Hans: 图片大小限制 (MB)
  llm_description: Max size in MB for each PNG image. If exceeded, zoom factor will automatically downgrade. Leave empty for no limit.
  name: max_image_size
  required: false
  type: number

